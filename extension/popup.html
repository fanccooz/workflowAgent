<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>华荣流程助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>流程助手</h1>
    <p class="hint">在已登录的华荣页面上说要打开哪条流程。</p>
    <textarea id="utterance" rows="3" placeholder="例如：打开请假流程"></textarea>
    <button id="run" type="button">执行</button>
    <button id="settings" type="button" class="secondary">DeepSeek 设置</button>
    <p id="result" class="result" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
